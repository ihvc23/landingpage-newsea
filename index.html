<!doctype html>
<!-- Landing page redesenhada com base na estrutura da RF Mídias -->
<html lang="pt-BR">
<head>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const sections = document.querySelectorAll('section');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('show');
          }
        });
      }, { threshold: 0.1 });

      sections.forEach(section => {
        section.classList.add('hidden');
        observer.observe(section);
      });
    });
  </script>
  <style>
    .hidden {
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }
    .show {
      opacity: 1;
      transform: none;
    }
  </style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Soluções logísticas da NEWSEA LOG: transporte, armazenagem e distribuição com agilidade e inteligência.">
  <title>NEWSEA LOG - Soluções Logísticas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans&display=swap">
  <style>
    :root {
      --primary: #0A1F44;
      --accent: #A3C644;
      --text: #2c2c2c;
      --light: #f9f9f9;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', sans-serif;
      color: var(--text);
      background: var(--light);
    }
    header {
      background: var(--primary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
    }
    header img {
      height: 48px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: bold;
    }
    .hero {
      background: url('file-XXKZ9EN6oNm92hLjcZngme') center/cover no-repeat;
      color: white;
      text-align: center;
      padding: 6rem 2rem;
    }
    .hero h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.5rem;
    }
    .hero p {
      margin: 1rem auto;
      max-width: 600px;
    }
    .cta {
      background: var(--accent);
      color: var(--primary);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      margin-top: 1.5rem;
      cursor: pointer;
    }
    section {
      padding: 4rem 2rem;
      max-width: 1200px;
      margin: auto;
    }
    #sobre {
      background: url('file-TmCWQwQaqwzNzQ9ZNqy7eR') center/cover no-repeat;
      background-blend-mode: multiply;
      background-color: rgba(10, 31, 68, 0.6);
      color: white;
    }
    #servicos {
      background: url('file-PvLDWmnjY5LXGQxvRqGg69') center/cover no-repeat;
      background-blend-mode: overlay;
      background-color: rgba(255, 255, 255, 0.95);
    }
    #contato {
      background: url('file-e98e36a5-d661-45ff-b46f-f2ed8cba4fe5') center/cover no-repeat;
      background-blend-mode: lighten;
      background-color: rgba(255,255,255,0.85);
    }
    .section-title {
      font-family: 'Montserrat', sans-serif;
      color: var(--primary);
      font-size: 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    #sobre .section-title,
    #sobre p {
      color: #fff;
    }
    .features {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }
    .feature {
      background: white;
      border-radius: 0.75rem;
      padding: 2rem;
      flex: 1 1 300px;
      box-shadow: 0 0 12px rgba(0,0,0,0.05);
      text-align: center;
    }
    .feature img {
      height: 64px;
      margin-bottom: 1rem;
    }
    .bullets {
      max-width: 900px;
      margin: 2rem auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    .bullets li {
      list-style: none;
      background: white;
      padding: 1rem 1.5rem;
      border-left: 4px solid var(--accent);
      border-radius: 0.5rem;
      box-shadow: 0 0 8px rgba(0,0,0,0.03);
    }
    .logos-parceiros {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      margin-top: 2rem;
    }
    .logos-parceiros img {
      max-height: 48px;
      max-width: 120px;
      object-fit: contain;
      filter: grayscale(100%);
    }
    form {
      display: grid;
      gap: 1rem;
      background: white;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    input, textarea {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-family: inherit;
      width: 100%;
    }
    footer {
  background: url('file-RL8j9uCdX4sn9pykNtSkG2') center/cover no-repeat, var(--primary);
  color: white;
  text-align: center;
  padding: 2rem 1rem;
  margin-top: 4rem;
  background-blend-mode: multiply;
}
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2rem;
      }
      .bullets {
        grid-template-columns: 1fr;
      }
      .logos-parceiros {
        gap: 1rem;
        flex-direction: column;
      }
    }
    .cta:hover {
    transform: scale(1.05);
    transition: all 0.3s ease-in-out;
  }
  h1, h2.section-title {
    transition: all 0.5s ease-in-out;
  }
  .show h1, .show h2.section-title {
    transform: translateY(0);
    opacity: 1;
  }
</style>


</head>
<body>
  <header>
    <img src="logo-newsea.png" alt="Logotipo NEWSEA LOG">
    <nav>
      <a href="#sobre">Sobre</a>
      <a href="#servicos">Serviços</a>
      <a href="#contato">Contato</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Logística que move seu negócio</h1>
    <p>Transporte, armazenagem e distribuição com inteligência e segurança.</p>
    <button class="cta">Fale com um especialista</button>
  </section>
  <section id="missao" style="background: url('file-8AanUKePxtJJeQ4Pvc9hTS') center/cover no-repeat; background-blend-mode: multiply; background-color: rgba(10, 31, 68, 0.7); color: white; text-align: center;">
    <h2 class="section-title">Nossa Missão</h2>
    <p style="max-width: 800px; margin: auto;">Garantir excelência logística com tecnologia, pontualidade e comprometimento em todas as etapas da cadeia de suprimentos.</p>
  </section>
